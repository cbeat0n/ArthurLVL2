<!DOCTYPE html>
<!-- 
  homepage.html is an agnostic framework to setup the Flask delivery
  for the dynamic webpage and UI that Arthur uses to provide
  trading information.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='oldmoney.css') }}">
  <title>Arthur — Parlor Room</title>
</head>
<body class="arthur-home">
  <div class="arthur-wrap">
    <header class="arthur-header">
      <h1 class="arthur-brand">Arthur - Parlor Room</h1>
      <div class="arthur-sub">Master Handicapper</div>
    </header>

    <main class="container">
      <h1 class="hero-title">-What are you interested in today, Sir?-</h1>

      <!-- Control Panel -->
      <form method="POST" action="/start" target="_blank" id="startForm" autocomplete="off">
        <!-- Single FX pair -->
        <label for="currencyPair">FX Pair:</label>
        <select name="currencyPair" id="currencyPair" required>
          <option value="USD_JPY" selected>USD/JPY</option>
          <option value="USD_CHF">USD/CHF</option>
          <option value="USD_MXN">USD/MXN</option>
          <option value="EUR_USD">EUR/USD</option>
        </select>

        <!-- Intake granularity (data realtime frequency) -->
        <label for="intake">Intake Granularity:</label>
        <select name="intake" id="intake" required>
          <option value="S5" selected>S5</option>
          <option value="S10">S10</option>
          <option value="S15">S15</option>
          <option value="S30">S30</option>
        </select>

        <!-- Horizon granularity (decision frequency) -->
        <label for="horizon">Horizon Granularity:</label>
        <select name="horizon" id="horizon" required>
          <option value="M1Q0">M1</option>
          <option value="M1Q1">M1.25</option>
          <option value="M1Q2">M1.5</option>
          <option value="M1Q3">M1.75</option>
          <option value="M2Q0">M2</option>
          <option value="M2Q1">M2.25</option>
          <option value="M2Q2">M2.5</option>
          <option value="M2Q3">M2.75</option>
          <option value="M3Q0">M3</option>
          <option value="M3Q1">M3.25</option>
          <option value="M3Q2">M3.5</option>
          <option value="M3Q3">M3.75</option>
          <option value="M4Q0">M4</option>
          <option value="M4Q1">M4.25</option>
          <option value="M4Q2">M4.5</option>
          <option value="M4Q3">M4.75</option>
          <option value="M5Q0">M5</option>
          <option value="M5Q1">M5.25</option>
          <option value="M5Q2">M5.5</option>
          <option value="M5Q3">M5.75</option>
          <option value="M6Q0">M6</option>
          <option value="M6Q1">M6.25</option>
          <option value="M6Q2">M6.5</option>
          <option value="M6Q3">M6.75</option>
          <option value="M7Q0">M7</option>
          <option value="M7Q1">M7.25</option>
          <option value="M7Q2">M7.5</option>
          <option value="M7Q3">M7.75</option>
          <option value="M8Q0">M8</option>
          <option value="M8Q1">M8.25</option>
          <option value="M8Q2">M8.5</option>
          <option value="M8Q3">M8.75</option>
          <option value="M9Q0">M9</option>
          <option value="M9Q1">M9.25</option>
          <option value="M9Q2" selected>M9.5</option>
          <option value="M9Q3">M9.75</option>
          <option value="M10Q0">M10</option>
        </select>

        <!-- Zone granularity (decision context frequency) -->
        <label for="zone">Zone Granularity:</label>
        <select name="zone" id="zone" required>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
        </select>

        <!-- Number of Managers, MVP = 1-->
        <label for="Managers"># Managers:</label>
        <select name="Managers" id="Managers" required>
          <option value="1" selected>1</option>
        </select>

        <!-- Number of traders on this single pair -->
        <label for="traders"># Traders on each team:</label>
        <select name="traders" id="traders" required>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>

        <!-- Mode-->
        <label for="mode">Mode:</label>
        <select name="mode" id="mode" required>
          <option value="Demo" selected>Demo</option>
          {% if allowLive %}<option value="Live">Live</option>{% endif %}
        </select>

        {% if allowLive %}
        <!-- Live mode is real money, so it needs this ticked -->
        <label for="confirmLive"><input type="checkbox" name="confirmLive" id="confirmLive" value="yes"> Live uses real money. Tick to confirm.</label>
        {% else %}
        <div class="muted" id="liveNote">Live mode is switched off (ALLOW_LIVE in Arthur.py).</div>
        {% endif %}

        <!-- Vault Button -->
        <button type="submit" id="startButton">Vault &amp; Overhang Access</button>
        <div class="muted" id="formNote" role="status" aria-live="polite"></div>

      </form>

    </main>
  </div>

  <script>
  (function () {
    // Mirror of utils/granularity.py so a bad pairing can't be chosen. The server checks again.
    // A horizon MxQn lasts 60*x + 15*n seconds and must be a whole number of intake candles.
    const INTAKE_SECONDS = { S5: 5, S10: 10, S15: 15, S30: 30 };
    const intake = document.getElementById("intake");
    const horizon = document.getElementById("horizon");
    const note = document.getElementById("formNote");

    function horizonSeconds(value) {
      const m = /^M(\d+)Q([0-3])$/.exec(value);
      return m ? 60 * parseInt(m[1]) + 15 * parseInt(m[2]) : NaN;
    }

    function applyIntake() {
      const step = INTAKE_SECONDS[intake.value];
      let firstValid = null;
      Array.from(horizon.options).forEach(function (opt) {
        const ok = horizonSeconds(opt.value) % step === 0;
        opt.disabled = !ok;
        if (ok && !firstValid) firstValid = opt;
      });
      if (horizon.selectedOptions[0] && horizon.selectedOptions[0].disabled && firstValid) {
        horizon.value = firstValid.value;
        note.textContent = "Horizon changed to " + firstValid.text + ": " + intake.value + " candles need a horizon that is a whole number of candles.";
      } else {
        note.textContent = "";
      }
    }
    intake.addEventListener("change", applyIntake);
    applyIntake();

    // One start per click. The server ignores a second start, but this stops a double click opening two tabs.
    const form = document.getElementById("startForm");
    const button = document.getElementById("startButton");
    form.addEventListener("submit", function () {
      button.disabled = true;
      setTimeout(function () { button.disabled = false; }, 4000);
    });
    window.addEventListener("pageshow", function () { button.disabled = false; applyIntake(); });
  })();
  </script>

</body>
</html>
