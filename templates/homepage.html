<!-- 
  homepage.html is an agnostic framework to setup the Flask delivery
  for the dynamic webpage and UI that Arthur uses to provide
  trading information.
-->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='oldmoney.css') }}">
  <title>Arthur — Parlor Room</title>
</head>
<body class="arthur-home">
  <div class="arthur-wrap">
    <header class="arthur-header">
      <h1 class="arthur-brand">Arthur - Parlor Room</h1>
      <div class="arthur-sub">Master Handicapper</div>
    </header>

    <main class="container">
      <h1 class="hero-title">-What are you interested in today, Sir?-</h1>

      <!-- Control Panel -->
      <form method="GET" action="/accounting" target="_blank">
        <!-- Single FX pair -->
        <label for="currencyPair">FX Pair:</label>
        <select name="currencyPair" id="currencyPair" required>
          <option value="USD_JPY" selected>USD/JPY</option>
          <option value="USD_CHF">USD/CHF</option>
          <option value="USD_MXN">USD/MXN</option>
          <option value="EUR_USD">EUR/USD</option>
        </select>

        <!-- Intake granularity (data realtime frequency) -->
        <label for="intake">Intake Granularity:</label>
        <select name="intake" id="intake" required>
          <option value="S5" selected>S5</option>
        </select>

        <!-- Horizon granularity (decision frequency) -->
        <label for="horizon">Horizon Granularity:</label>
        <select name="horizon" id="horizon" required>
          <option value="M2Q0">M2</option>
          <option value="M2Q1">M2.25</option>
          <option value="M2Q2">M2.5</option>
          <option value="M2Q3">M2.75</option>
          <option value="M3Q0">M3</option>
          <option value="M3Q1">M3.25</option>
          <option value="M3Q2">M3.5</option>
          <option value="M3Q3">M3.75</option>
          <option value="M4Q0">M4</option>
          <option value="M4Q1">M4.25</option>
          <option value="M4Q2">M4.5</option>
          <option value="M4Q3">M4.75</option>
          <option value="M5Q0">M5</option>
          <option value="M5Q1">M5.25</option>
          <option value="M5Q2">M5.5</option>
          <option value="M5Q3">M5.75</option>
          <option value="M6Q0">M6</option>
          <option value="M6Q1">M6.25</option>
          <option value="M6Q2">M6.5</option>
          <option value="M6Q3">M6.75</option>
          <option value="M7Q0">M7</option>
          <option value="M7Q1">M7.25</option>
          <option value="M7Q2">M7.5</option>
          <option value="M7Q3">M7.75</option>
          <option value="M8Q0">M8</option>
          <option value="M8Q1">M8.25</option>
          <option value="M8Q2">M8.5</option>
          <option value="M8Q3">M8.75</option>
          <option value="M9Q0">M9</option>
          <option value="M9Q1">M9.25</option>
          <option value="M9Q2">M9.5</option>
          <option value="M9Q3">M9.75</option>
          <option value="M10"selected>M10</option>
        </select>

        <!-- Zone granularity (decision context frequency) -->
        <label for="zone">Zone Granularity:</label>
        <select name="zone" id="zone" required>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
        </select>

        <!-- Number of Managers, MVP = 1-->
        <label for="managers"># Managers:</label>
        <select name="Managers" id="Managers" required>
          <option value="1" selected>1</option>
        </select>

        <!-- Number of traders on this single pair -->
        <label for="traders"># Traders on each team:</label>
        <select name="traders" id="traders" required>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>

        <!-- Mode-->
        <label for="mode">Mode:</label>
        <select name="mode" id="mode" required>
          <option value="Demo" selected>Demo</option>
          <option value="Live">Live</option>
        </select>
      
      <!-- Vault Button -->
        <button type ="submit">Vault & Overhang Access</button>
      
      </form>

    </main>
  </div>

</body>
</html>
