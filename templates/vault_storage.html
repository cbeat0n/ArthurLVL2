<!-- vault_storage.html is a modular and agnostic framework that shows an account wide summary
 for the process of Arthur, including a summary of the accounting at hand
 and the instance of Arthur being ran at present moment. -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='vaultshine.css') }}">
  <title>Arthur | Vault Storage</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script> 
  <!-- Static version, watch this parameter-->
</head>
<body>
  <header>
    <div>
      <h1>Vault Storage</h1>
      <div class="muted">Instrument: <strong>{{ instrument|default('—') }}</strong> • Horizon: <strong>{{ refreshRate|default('—') }}</strong></div>
    </div>
    <div class="row">
      <a class="btn" target = '_blank' href="/visualize/?signalFile={{ signalFile|default('') }}&instrument={{ instrument|default('') }}&horizon={{ refreshRate|default('') }}&zone={{ zone|default('') }}">Open Market View</a>
      <form method="post" action="/accounting">
        <label for="autoSwitch">Automation Switch:</label>
          <select name="autoSwitch" id="autoSwitch"required>
            <option value="OPEN">Open</option>
            <option value="HOLDING">Holding</option>
            <option value="CLOSED">Closed</option>
            <option value="AUTOMATED">Automated</option>
          </select>
          <button type="submit">Apply</button>
      </form>
    </div>
  </header>
  <main>
    <!-- Account Summary -->
    <section class="card">
      <h2>Account Summary</h2>
      <div class="grid">
        {% if accountSummary %}
          {% for k, v in accountSummary.items() %}
            <div class="card">
              <div class="muted">{{ k }}</div>
              <div style="font-size:18px; font-weight:600;">{{ v }}</div>
            </div>
          {% endfor %}
        {% else %}
          <div class="muted">No account summary available.</div>
        {% endif %}
      </div>
    </section>
  </main>
  <script>
  (function () {
    
    function getRefreshMs(horizon) {
      const match = horizon.match(/M(\d+)(?:Q(\d))?/);

      const minutes = parseInt(match[1]);
      const quarters = match[2] ? parseInt(match[2]) / 4 : 0;
      const totalMinutes = minutes + quarters;

      return totalMinutes * 60 * 1000;
    }

    
    const horizon = "{{ refreshRate }}"; // e.g. M2, M2Q1, M5, etc.
    const rr = getRefreshMs(horizon);
    console.log(`UI Refresh: ${horizon} → ${rr / 1000}s`);

    if (!isNaN(rr) && rr > 0) {
      setInterval(() => {
        location.reload();
      }, rr);
    }
    })();
  </script>
</body>
</html>
